name: Variant Quality Matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-quality-gates:
    name: Core Quality Gates (radium)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run quality gate (radium)
        run: npm run quality:gate

  web-demo:
    name: Quality Gate (demo)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate (demo)
        run: npm run quality:gate:demo
        env:
          VITE_BRAND_MODE: demo
